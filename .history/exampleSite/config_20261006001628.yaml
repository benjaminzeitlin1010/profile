  about:
    enable: true
    title: "About Me"
    image: "/images/me.jpg"
    content: |
      My career goal is to produce impactful tools to help the betterment of society. I am a passionate individual that specializes in data analysis, data engineering, software development, and database management. I love leveraging technology to solve complex challenges. I have experience working on projects in various fields, including health data, biostatistics, web development, and environmental data analysis. 

      Skills:
      - Programming Languages: Python, SQL, Java, C, CUDA, Typescript, Javascript, R
      - Data Manipulation Tools: Databricks, Airflow, AWS services including EMR and S3, PySpark, Postgres, DBeaver, Oracle Systems, Microsoft Azure
      - Software Development & Management Tools: GitHub, GitLab, Visual Studio Code, ERD Design, LaTeX

  experience:
  title: "Work Experience"
  enable: true
  items:
    - job: "Associate Consultant Data Engineer"
      company: "Kollabio"
      companyUrl: "https://kollabio.com"
      date: "January 2026 - Present"
      content: |
        - Solo Contributor for Kollabio's involvement at CORMAC, contributing to the QIES to IQIES modernization project on the QMIR Data Operations team.
        - Contributed to Medicare/Medicaid data migration from PostgreSQL to Databricks using Databricks, Airflow, PySpark, and AWS.
        - Documented and designed changes to the Provider of Service Report System for data related to CMS health contracted facilities including CORF, LTCH, XRAY, and others.
        - Modified the data pipeline backend for new CMS services using Python and SQL to enable smooth verification of CMS provider certification processes.
        - Supported production releases and the transition from legacy QIES systems to IQIES by updating user-facing Databricks notebooks and resolving MAC-IRF helpdesk requests.
        - Served as the release engineer for Data Operations and represented team leadership when leadership was unavailable.
    - job: "Associate Consultant Data Analyst"
      company: "Kollabio"
      companyUrl: "https://kollabio.com"
      date: "March 2025 - December 2025"
      content: |
        - Owned the manual process of the Central Data Repository data dictionary system and supported schema migration processes.
        - Collaborated with the QMIR Data Architect to map OLTP schemas to Databricks and maintain accurate table mappings across systems.
        - Supported the CMS report distribution process through Airflow, producing front-facing monthly reports for LTCH, HHA, IRF, and HHVBP programs.
        - Kollabio CEO: Coming in with a data analytics background and transitioning into a data engineering role in on a complex CMS engagement is not trivial - and you handled it well. 4.7/5.0 on the 2025 Annual Review."

      - job: "Data Science Undergraduate Researcher"
        company: "Virginia Tech Center for Biostatistics and Health Data Science"
        companyUrl: "https://biostat.centers.vt.edu"
        date: "April 2023 - May 2024"
        content: |
          - Compiled statistical reports in R and Python for an introductory biostatistics research program to underrepresented communities sponsored by the National Institutes of Health, iThrive, and AbbVie.
          - Produced ANOVA tables and PCA analyses for data preparation, cleaning, and visualizations of clientele data.
          - Had the honor with working to help publish a research paper clearing the production of the CUBE program which resulted in doubling the size of the program.
          - Helped PhD students create proper statistical reports for their health research including HIPAA compliant work.

      - job: "Computing Consultant"
        company: "Virginia Tech Academy of Data Science"
        companyUrl: "https://data.science.vt.edu"
        date: "January 2024 - May 2024"
        content: |
          - Advised clients on data analysis, gathering, and experimental design using Bayesian methods in R and Python.
          - Tutored students in computational modeling and data anlaytics after university hours. 

      - job: "Web Developer"
        company: "Virginia Tech Academy of Integrated Science"
        companyUrl: "https://www.ais.science.vt.edu"
        date: "March 2023 - April 2024"
        content: |
          - Designed, deployed, and maintained a comprehensive website for managing information related to multiple majors and minors.
          - Used Ensemble (a proprietary software that uses CSS and HTML) to produce Virginia Tech related webpages.
          - Worked with professors to produce their news reports on their respective webpages.

      - job: "Computer Science Teaching Assistant"
        company: "Virginia Tech College of Engineering"
        companyUrl: "https://eng.vt.edu"
        date: "August 2022 - May 2023"
        content: |
          - Undergraduate Teaching Assistant for Introductiory Python for Non-technical students.
          - Substitute Instructor for an Introductory Python course with 90+ students, covering programming fundamentals, OOP, and search algorithms using Python Jupyter.
          - Assisted 400+ students 3 days a week in help sessions on sorting algorithms and dictionaries.

  education:
